[project]
name = "magic-lists-for-navidrome"
version = "0.3.8"
description = "Navidrome smart-playlist generator (FastAPI backend + web frontend)."
requires-python = ">=3.11"

# §2: the single source of truth for the version; bump with
# `bump-my-version bump <part>` (patch/minor/major) — never hand-edit.
# Runtime dependencies are installed from requirements.txt (see the Dockerfile);
# this file exists as the version SSOT + bump-my-version config, not a build
# target, so it deliberately declares no [build-system].
[tool.bumpversion]
current_version = "0.3.8"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'


[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `backend` importable from the repo root. `python -m unittest` and
# `python -m pytest` both put the working directory on sys.path implicitly, but
# a bare `pytest` does not — which is how CI invokes it, so without this the
# whole suite fails to collect there while passing locally.
pythonpath = ["."]
# The suite is stdlib unittest.TestCase classes, which pytest collects natively.
# Keep it that way: the tests must pass under `python -m unittest discover` too,
# so nothing here may become load-bearing.
python_files = ["test_*.py"]


[tool.coverage.run]
source = ["backend"]
# The scoring functions log heavily via print(); nothing here needs branch
# coverage's extra bookkeeping to be meaningful.
branch = false


# REPO-STANDARDS §4 requires ≥80% coverage of the component's CORE code, enforced
# in CI. `include` below is that core: the pure logic that encodes the product
# rules, plus the persistence and auth layers now that integration tests reach
# them.
#
# Still outside the gate, and why:
#   - main.py (50%), navidrome_client.py (57%), ai_client.py (44%) — covered
#     through the integration and browser suites rather than directly. Adding
#     any of them today would pull the aggregate under the floor; add them as
#     their own coverage climbs.
#   - rediscover.py — barely covered, and large enough to sink the aggregate
#     on its own. The clearest next target.
#   - schemas.py — Pydantic declarations, "covered" by import alone. Including
#     it would inflate the number without testing anything.
#
# Whole-backend coverage is ~60% and CI prints it on every run, so the gap stays
# visible rather than hidden behind a green gate.
#
# The floor moves up, never down: raised to 85 once the aggregate reached 87%,
# so the number can't quietly sag back toward the old floor.
[tool.coverage.report]
include = [
    "backend/radio.py",
    "backend/track_scoring.py",
    "backend/lastfm_client.py",
    "backend/recipe_manager.py",
    "backend/ai_response.py",
    "backend/database.py",
    "backend/auth.py",
    "backend/errors.py",
]
fail_under = 85
show_missing = true
skip_covered = false
