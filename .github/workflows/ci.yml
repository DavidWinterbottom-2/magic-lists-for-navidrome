name: ci

# Adapted from the devcontainer-sandbox template's ci.yml. The template assumes a
# packaged project (pip install -e .[dev]); this repo installs from
# requirements.txt + requirements-dev.txt because it's an app, not a package.
#
# REPO-STANDARDS §4 coverage gate: the test job fails below 80% coverage of the
# CORE logic. Which modules count as core, and why the route/IO layers are
# outside the gate, is declared in [tool.coverage.report] in pyproject.toml —
# one place, not duplicated here. The whole-backend number is printed after
# every run so the untested layers stay visible rather than hidden by the gate.
#
# The e2e job below covers §4's browser-driven requirement for a web UI. It
# drives the real app in headless Chromium against a fake Navidrome and a fake
# AI provider (see e2e/README.md), so it needs no secrets and no network.
#
# Minutes are saved on PRs: `changes` classifies the diff with
# .github/scripts/code-changed.sh, and test/e2e are skipped (reported as
# passing, so required checks don't block) when it touches docs only or the PR
# is a draft. A new push cancels the PR's still-running CI. Pushes to main
# always run the full suite and are never cancelled.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  # PRs share a group per branch so a new push cancels the old run; every push
  # run gets its own group so no main build is cancelled or dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only or not. On a push to main there is nothing to skip, so it always
  # answers code=true there.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            .github/scripts/code-changed.sh | tee -a "$GITHUB_OUTPUT"
          else
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
          fi

  # Catch real breakage (syntax errors, undefined names) on every change. This is
  # the "hard errors" subset of ruff, not a style gate — the repo has no ruff
  # config yet, so a full `ruff check` would drown the signal in legacy noise.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select=E9,F63,F7,F82 .
      - run: python -m compileall backend tests

      # AGENTS.md is the canonical list of what directs an agent here; the
      # README's map is rendered from it. Fail if someone edited one and not
      # the other — a doc map that misdescribes the docs is worse than none.
      - name: Documentation map is in sync with AGENTS.md
        run: python scripts/generate-docs-map.py --check

  test:
    needs: changes
    # Skip only on a definite docs-only answer or a draft. `!cancelled()` lets
    # this run when `changes` itself failed (its output is then empty, not
    # 'false'), so a broken classifier runs the tests instead of skipping them,
    # and a skip, which reports as passing, can't let a code change through.
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Invoked as `python -m` throughout, not the bare `pytest` / `coverage`
      # console scripts: `python -m` guarantees the interpreter pip just
      # installed into (a PATH shadowed by another pytest silently loses the
      # -cov plugin) and puts the repo root on sys.path.

      # Fails under 80% on the core modules (fail_under lives in pyproject.toml).
      - name: Tests + core coverage gate
        run: python -m pytest -q --cov=backend --cov-report=term-missing

      # Informational only — never fails the build. This is the number that has
      # to come up over time as the I/O layers gain integration tests.
      - name: Whole-backend coverage (not gated)
        run: python -m coverage report --include='backend/*' --fail-under=0

      # The suite must keep running under the stdlib runner too: pytest is the
      # gate, but nothing in tests/ may depend on pytest-only features.
      - name: Tests under stdlib unittest
        run: python -m unittest discover -s tests -p 'test_*.py'

  # REPO-STANDARDS §4: a web UI needs tests that drive the actual UI in a
  # browser. Separate job because it needs a browser install the other jobs
  # don't, and because a UI failure should be legible as a UI failure.
  e2e:
    needs: changes
    # Skip only on a definite docs-only answer or a draft. `!cancelled()` lets
    # this run when `changes` itself failed (its output is then empty, not
    # 'false'), so a broken classifier runs the tests instead of skipping them,
    # and a skip, which reports as passing, can't let a code change through.
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # The devcontainer ships pre-provisioned browsers; a CI runner doesn't.
      # --with-deps pulls the system libraries headless Chromium needs.
      # Browsers are cached per installed Playwright version; --with-deps still
      # installs the system libraries, which the cache doesn't hold.
      - id: pw
        run: |
          echo "version=$(pip show playwright | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        run: python -m playwright install chromium
        timeout-minutes: 5  # browser only (no --with-deps): the image has its libraries; apt timed out on a slow mirror

      - name: Browser end-to-end tests
        run: python -m pytest e2e/ -q --browser chromium --tracing retain-on-failure

      # A UI test that fails only in CI is close to undebuggable without one of
      # these: the trace replays the run frame by frame.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
