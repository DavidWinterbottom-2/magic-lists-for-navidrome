name: template-sync

# Pulls shared assets from the devcontainer-sandbox template and opens ONE PR,
# with auto-merge requested, when this repo has drifted behind it. Retrofit onto
# ANY repo (bootstrapped from the template or not) by adding this file AND a repo
# secret TEMPLATE_SYNC_TOKEN.
#
# This file is a thin wrapper: the sync logic lives in the template's
# scripts/template-sync.sh and runs straight from the template checkout, so a
# change to it takes effect on the next run in every repo. What is synced, and
# how auto-merge behaves, is documented at the top of that script.
#
# Runs weekly and on demand only. Updating the template never opens PRs by
# itself; they come from the next weekly run, or from a manual run
# (Actions → template-sync → Run workflow, or `gh workflow run template-sync.yml`).
#
# TEMPLATE_SYNC_TOKEN must be a PAT with, on this repo, contents:write +
# workflows:write + pull-requests:write, and contents:read on the private
# template. A classic PAT with the `repo` + `workflow` scopes covers both. The
# default GITHUB_TOKEN can't do it: it may not push .github/workflows/* files,
# and a PAT-created PR sidesteps the "Allow GitHub Actions to create and approve
# pull requests" setting.
# The .devcontainer/ is intentionally NOT synced: it carries per-project deltas
# (see .devcontainer/TEMPLATE-SYNC.md) and wants a 3-way merge.

on:
  schedule:
    # Weekly, Sundays at 22:00 UTC: a few hours before Hermes's weekly cycle
    # (Mondays 01:00 UTC) so Hermes always reasons on freshly-synced skills.
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # normally under a minute
    # No-op in the template repo itself; only downstream copies sync.
    if: github.repository != 'DavidWinterbottom-2/devcontainer-sandbox'
    # One sync at a time, so a manual run can't race the scheduled one.
    concurrency:
      group: template-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the sync PAT
        env:
          TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TEMPLATE_SYNC_TOKEN is not set. It must be a PAT with contents:write + workflows:write + pull-requests:write on this repo and contents:read on the template (classic PAT: repo + workflow scopes)."
            exit 1
          fi

      # Check out with the PAT: checkout saves its token as the git credential,
      # and only the PAT may push .github/workflows/* files.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch the template (private → needs a read token)
        uses: actions/checkout@v4
        with:
          repository: DavidWinterbottom-2/devcontainer-sandbox
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          path: .template-src
          fetch-depth: 1

      - name: Sync from the template, open the PR, request auto-merge
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: bash .template-src/scripts/template-sync.sh
